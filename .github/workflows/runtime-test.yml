name: Runtime Test

on:
    workflow_dispatch:
        inputs:
            levilamina_version:
                description: "LeviLamina version to install, e.g. 26.51.6. Leave empty to read it from tooth.json."
                required: false
                default: ""
    schedule:
        - cron: "0 18 * * 0"
    push:
        tags:
            - "v*"

concurrency:
    group: runtime-test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    runtime-test:
        runs-on: windows-latest
        timeout-minutes: 40

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Resolve LeviLamina version
              id: llver
              shell: pwsh
              run: |
                  $ver = "${{ inputs.levilamina_version }}"
                  if ([string]::IsNullOrWhiteSpace($ver)) {
                      $m = Select-String -Path xmake.lua -Pattern 'levilamina\s+([0-9.]+)'
                      if (-not $m) { throw "cannot find levilamina version in xmake.lua" }
                      $ver = $m.Matches[0].Groups[1].Value
                  }
                  "version=$ver" >> $env:GITHUB_OUTPUT
                  Write-Host "LeviLamina version -> $ver"

            - name: Cache xmake
              uses: actions/cache@v4
              with:
                  path: ~/AppData/Local/.xmake
                  key: xmake-debug-server-${{ hashFiles('xmake.lua') }}
                  restore-keys: xmake-

            - name: Setup xmake
              uses: xmake-io/github-action-setup-xmake@v1

            - name: Setup LLVM
              uses: ZhongRuoyu/setup-llvm@v0
              with:
                  llvm-version: 22

            - name: Build plugin (debug, server)
              shell: pwsh
              run: |
                  xmake repo -u
                  xmake f -a x64 -m debug -p windows -y --target_type=server
                  xmake -v -y

            - name: Install lip
              shell: pwsh
              run: |
                  $release = Invoke-RestMethod -Uri "https://api.github.com/repos/futrime/lip/releases/latest"
                  $asset = $release.assets |
                      Where-Object { $_.name -like "lip-*-win-x64.zip" } |
                      Select-Object -First 1
                  if (-not $asset) { throw "no lip win-x64 zip in $($release.tag_name)" }
                  Write-Host "lip $($release.tag_name) -> $($asset.name)"
                  Invoke-WebRequest -Uri $asset.browser_download_url -OutFile lip.zip
                  Expand-Archive -Path lip.zip -DestinationPath lip -Force
                  $exe = (Resolve-Path ./lip/lip.exe).Path
                  "LIP=$exe" >> $env:GITHUB_ENV
                  & $exe --version

            - name: Install LeviLamina and BDS
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path server | Out-Null
                  Push-Location server
                  try {
                      & $env:LIP install "github.com/LiteLDev/LeviLamina@${{ steps.llver.outputs.version }}"
                      if ($LASTEXITCODE -ne 0) { throw "lip install failed with $LASTEXITCODE" }
                  } finally {
                      Pop-Location
                  }
                  Get-ChildItem server | Select-Object Name

            - name: Deploy plugin
              shell: pwsh
              run: |
                  $src = "build/bin-server/LOICollectionA"
                  if (-not (Test-Path $src)) { throw "build output missing: $src" }
                  New-Item -ItemType Directory -Force -Path "server/plugins" | Out-Null
                  Copy-Item -Path $src -Destination "server/plugins/" -Recurse -Force
                  Get-ChildItem "server/plugins/LOICollectionA" | Select-Object Name

            - name: Prepare server
              shell: pwsh
              run: |
                  $cfg = "server/server.properties"
                  if (-not (Test-Path $cfg)) { New-Item -ItemType File -Force -Path $cfg | Out-Null }

                  foreach ($pair in @{ "online-mode" = "false"; "server-port" = "19132"; "allow-list" = "false" }.GetEnumerator()) {
                      $key = $pair.Key
                      $value = $pair.Value
                      $text = Get-Content $cfg -Raw -ErrorAction SilentlyContinue
                      if ($null -eq $text) { $text = "" }
                      if ($text -match "(?m)^$([regex]::Escape($key))=") {
                          $text = $text -replace "(?m)^$([regex]::Escape($key))=.*$", "$key=$value"
                      } else {
                          $text = $text.TrimEnd("`r", "`n") + "`n$key=$value`n"
                      }
                      Set-Content -Path $cfg -Value $text -NoNewline -Encoding ascii
                  }

                  Remove-Item "server/allowlist.json" -Force -ErrorAction SilentlyContinue
                  Remove-Item "server/permissions.json" -Force -ErrorAction SilentlyContinue

                  foreach ($key in "online-mode=false", "server-port=19132", "allow-list=false") {
                      if (-not (Select-String -Path $cfg -Pattern "^$([regex]::Escape($key))$" -Quiet)) {
                          throw "server.properties was not prepared correctly: missing $key"
                      }
                  }
                  Get-Content $cfg | Write-Host

            - name: Run the suite twice, default config first then all modules
              id: runtest
              continue-on-error: true
              run: |
                  "failed=false" >> $env:GITHUB_OUTPUT
                  "ran=true" >> $env:GITHUB_OUTPUT
                  "state=unknown" >> $env:GITHUB_OUTPUT
                  "run1_passed=0" >> $env:GITHUB_OUTPUT
                  "run1_failed=0" >> $env:GITHUB_OUTPUT
                  "run1_skipped=0" >> $env:GITHUB_OUTPUT
                  "run2_passed=0" >> $env:GITHUB_OUTPUT
                  "run2_failed=0" >> $env:GITHUB_OUTPUT
                  "run2_skipped=0" >> $env:GITHUB_OUTPUT

                  function Read-Shared {
                      param([string]$Path)
                      if (-not (Test-Path $Path)) { return "" }
                      try {
                          $fs = [System.IO.File]::Open($Path, 'Open', 'Read', 'ReadWrite')
                          try {
                              $sr = New-Object System.IO.StreamReader($fs)
                              return $sr.ReadToEnd()
                          } finally { $fs.Dispose() }
                      } catch { return "" }
                  }

                  function Read-ServerLog {
                      param([string]$Stdout)
                      $file = "server/logs/latest.log"
                      if (Test-Path $file) {
                          $text = Read-Shared $file
                          if ($text) { return $text }
                      }
                      return Read-Shared $Stdout
                  }

                  function Enable-AllFeatures {
                      param([string]$ConfigPath)

                      if (-not (Test-Path $ConfigPath)) { throw "config.json was not generated by the first run" }

                      $keepDisabled = @("LanguageServer.enabled", "ServerConfig.ProtableTool.OrderedUI")

                      function Enable-Node {
                          param($Node, [string]$Prefix)

                          foreach ($property in $Node.PSObject.Properties) {
                              $keyPath = if ($Prefix) { "$Prefix.$($property.Name)" } else { $property.Name }
                              $value = $property.Value

                              if ($value -is [bool]) {
                                  if ($keepDisabled -notcontains $keyPath) { $property.Value = $true }
                              } elseif ($value -is [pscustomobject]) {
                                  Enable-Node -Node $value -Prefix $keyPath
                              }
                          }
                      }

                      $config = Get-Content $ConfigPath -Raw | ConvertFrom-Json
                      Enable-Node -Node $config -Prefix ""
                      $config | ConvertTo-Json -Depth 16 | Set-Content -Path $ConfigPath -Encoding utf8
                  }

                  function Invoke-Suite {
                      param([string]$Tag, [switch]$EnableAll)

                      $cfg = "server/plugins/LOICollectionA/config/config.json"

                      if ($EnableAll) {
                          Enable-AllFeatures -ConfigPath $cfg
                          Write-Host "[$Tag] plugin config -> every module enabled"
                      } else {
                          Remove-Item $cfg -Force -ErrorAction SilentlyContinue
                          Write-Host "[$Tag] plugin config -> shipped defaults"
                      }

                      if (Test-Path "server/logs/latest.log") {
                          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
                          Move-Item "server/logs/latest.log" "artifacts/${Tag}__previous.log" -Force -ErrorAction SilentlyContinue
                      }

                      $exe = "server/bedrock_server_mod.exe"
                      if (-not (Test-Path $exe)) { throw "bedrock_server_mod.exe not found after lip install" }

                      $stdin  = (New-Item -ItemType File -Force -Path "server/_stdin_$Tag.log").FullName
                      $stdout = (New-Item -ItemType File -Force -Path "server/_stdout_$Tag.log").FullName
                      $stderr = (New-Item -ItemType File -Force -Path "server/_stderr_$Tag.log").FullName

                      $proc = Start-Process -FilePath (Resolve-Path $exe).Path `
                          -WorkingDirectory (Resolve-Path server).Path `
                          -RedirectStandardInput  $stdin `
                          -RedirectStandardOutput $stdout `
                          -RedirectStandardError  $stderr `
                          -PassThru -NoNewWindow

                      Write-Host "[$Tag] server pid $($proc.Id)"

                      $ready = $false
                      foreach ($i in 1..180) {
                          Start-Sleep -Seconds 1
                          if ((Read-ServerLog $stdout) -match "Server started") { $ready = $true; break }
                          if ($proc.HasExited) { break }
                      }

                      if (-not $ready) {
                          if ($proc.HasExited) {
                              Write-Host "::error::[$Tag] server exited with code $($proc.ExitCode) before reaching 'Server started'"
                          } else {
                              Write-Host "::error::[$Tag] server did not reach 'Server started' within 180s"
                              $proc.Kill()
                          }
                          Write-Host "::group::[$Tag] server log"
                          Read-ServerLog $stdout | Write-Host
                          Write-Host "::endgroup::"
                          Write-Host "::group::[$Tag] server stderr"
                          Read-Shared $stderr | Write-Host
                          Write-Host "::endgroup::"
                          $proc.WaitForExit()
                          return @{ Ready = $false; Finished = $false; Passed = 0; Failed = 0; Skipped = 0; Disabled = 0 }
                      }

                      Write-Host "[$Tag] server is ready, the test suite starts automatically on ServerStartedEvent"

                      $finished = $false
                      $waited = 0
                      foreach ($i in 1..900) {
                          Start-Sleep -Seconds 1
                          $waited = $i
                          if ((Read-ServerLog $stdout) -match "(?m)^\[.*?\]\[TestMain\] done: ") { $finished = $true; break }
                          if ($proc.HasExited) { break }
                          if ($i % 30 -eq 0) { Write-Host "[$Tag] waiting for the test suite, ${i}s..." }
                      }

                      if ($finished) {
                          Write-Host "[$Tag] test suite completed after ${waited}s, waiting for the server to stop itself"
                      } elseif ($proc.HasExited) {
                          Write-Host "[$Tag] server exited before the suite reported results"
                      } else {
                          Write-Host "::error::[$Tag] no test result within 900s"
                      }

                      foreach ($i in 1..120) {
                          if ($proc.HasExited) { break }
                          Start-Sleep -Seconds 1
                      }
                      if (-not $proc.HasExited) {
                          Write-Host "::warning::[$Tag] server did not stop on its own, stopping it through stdin"
                          Add-Content -Path $stdin -Value "stop" -Encoding ascii
                          foreach ($i in 1..60) {
                              Start-Sleep -Seconds 1
                              if ($proc.HasExited) { break }
                          }
                      }
                      if (-not $proc.HasExited) { $proc.Kill() }
                      $proc.WaitForExit()

                      $final = Read-ServerLog $stdout

                      Write-Host "::group::[$Tag] server log"
                      ($final -split "`r?`n" | Select-Object -Last 400) | Write-Host
                      Write-Host "::endgroup::"

                      New-Item -ItemType Directory -Force -Path artifacts | Out-Null
                      if (Test-Path "server/logs/latest.log") {
                          Move-Item "server/logs/latest.log" "artifacts/${Tag}__latest.log" -Force -ErrorAction SilentlyContinue
                      }
                      Move-Item $stdout "artifacts/${Tag}__stdout.log" -Force -ErrorAction SilentlyContinue
                      Move-Item $stderr "artifacts/${Tag}__stderr.log" -Force -ErrorAction SilentlyContinue

                      $passed = 0
                      $failed = 0
                      $skipped = 0
                      $disabled = 0

                      $m = [regex]::Match(
                          $final,
                          "(?m)^\[.*?\]\[TestMain\] done: (\d+) passed(?:, (\d+) failed)?(?:, (\d+) skipped)?(?:, (\d+) disabled)?"
                      )
                      if ($finished -and $m.Success) {
                          $passed = [int]$m.Groups[1].Value
                          if ($m.Groups[2].Success) { $failed   = [int]$m.Groups[2].Value }
                          if ($m.Groups[3].Success) { $skipped  = [int]$m.Groups[3].Value }
                          if ($m.Groups[4].Success) { $disabled = [int]$m.Groups[4].Value }
                      }

                      Write-Host "[$Tag] result: $passed passed, $failed failed, $skipped skipped, $disabled disabled"

                      return @{ Ready = $true; Finished = $finished; Passed = $passed; Failed = $failed; Skipped = $skipped; Disabled = $disabled }
                  }

                  try {
                      $r1 = Invoke-Suite -Tag "default"

                      if (-not $r1.Ready) {
                          "state=not-ready" >> $env:GITHUB_OUTPUT
                          return
                      }

                      $r2 = Invoke-Suite -Tag "all" -EnableAll

                      "run1_passed=$($r1.Passed)" >> $env:GITHUB_OUTPUT
                      "run1_failed=$($r1.Failed)" >> $env:GITHUB_OUTPUT
                      "run1_skipped=$($r1.Skipped)" >> $env:GITHUB_OUTPUT
                      "run2_passed=$($r2.Passed)" >> $env:GITHUB_OUTPUT
                      "run2_failed=$($r2.Failed)" >> $env:GITHUB_OUTPUT
                      "run2_skipped=$($r2.Skipped)" >> $env:GITHUB_OUTPUT

                      if (-not $r2.Ready) {
                          "state=not-ready" >> $env:GITHUB_OUTPUT
                          return
                      }

                      $failed = $r1.Failed -gt 0 -or $r2.Failed -gt 0
                      $ran = $r1.Finished -and $r2.Finished

                      "failed=$($failed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
                      "ran=$($ran.ToString().ToLower())" >> $env:GITHUB_OUTPUT
                      "state=done" >> $env:GITHUB_OUTPUT

                      Write-Host "::group::summary"
                      Write-Host ("{0,-9} {1,8} {2,8} {3,8} {4,9}" -f "run", "passed", "failed", "skipped", "disabled")
                      Write-Host ("{0,-9} {1,8} {2,8} {3,8} {4,9}" -f "default", $r1.Passed, $r1.Failed, $r1.Skipped, $r1.Disabled)
                      Write-Host ("{0,-9} {1,8} {2,8} {3,8} {4,9}" -f "all", $r2.Passed, $r2.Failed, $r2.Skipped, $r2.Disabled)
                      Write-Host "::endgroup::"
                  } catch {
                      Write-Host "::error::runtime test crashed: $_"
                      "state=error" >> $env:GITHUB_OUTPUT
                  }

            - name: Collect logs
              if: always()
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path artifacts | Out-Null
                  $sources = @()
                  $sources += Get-ChildItem -Path server -Filter "_*.log" -File -ErrorAction SilentlyContinue
                  $sources += Get-ChildItem -Path server/logs -Recurse -File -ErrorAction SilentlyContinue
                  foreach ($f in $sources) {
                      $rel = $f.FullName.Substring((Resolve-Path server).Path.Length).TrimStart('\', '/')
                      $dest = Join-Path artifacts ($rel -replace '[\\/]', '__')
                      Copy-Item $f.FullName $dest -Force
                  }
                  Get-ChildItem artifacts | Select-Object Name, Length

            - name: Upload logs artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: runtime-test-logs-${{ github.sha }}
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Report failures to Sentry
              if: always() && (steps.runtest.outputs.failed == 'true' || steps.runtest.outputs.state == 'not-ready' || steps.runtest.outputs.state == 'error')
              shell: pwsh
              env:
                  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:SENTRY_DSN)) {
                      Write-Host "::warning::SENTRY_DSN not configured, skipping Sentry report"
                      exit 0
                  }

                  npm install -g @sentry/cli --no-fund --no-audit

                  $release = "${{ github.sha }}"
                  $reason = if ("${{ steps.runtest.outputs.state }}" -eq "not-ready") {
                      "server never reached 'Server started'"
                  } elseif ("${{ steps.runtest.outputs.state }}" -eq "error") {
                      "runtime test script crashed"
                  } else {
                      "the test suite reported failures"
                  }

                  $combined = "artifacts/sentry__combined.log"
                  Remove-Item $combined -Force -ErrorAction SilentlyContinue
                  foreach ($tag in "default", "all") {
                      $p = "artifacts/${tag}__latest.log"
                      if (Test-Path $p) {
                          Add-Content -Path $combined -Encoding utf8 -Value "===== run: $tag ====="
                          Add-Content -Path $combined -Encoding utf8 -Value (Get-Content $p -Raw)
                      }
                  }

                  $logArgs = @()
                  if (Test-Path $combined) {
                      $logArgs = @("--logfile", $combined)
                  } else {
                      Write-Host "::warning::no server log to attach"
                  }

                  $detail = "default ${{ steps.runtest.outputs.run1_passed }}p/${{ steps.runtest.outputs.run1_failed }}f, all ${{ steps.runtest.outputs.run2_passed }}p/${{ steps.runtest.outputs.run2_failed }}f"

                  sentry-cli send-event `
                      -m "LOICollectionA runtime-test failed ($detail): %s" -a $reason `
                      -t ci:runtime-test `
                      -e "release:$release" `
                      -e "run:$env:GITHUB_RUN_ID" `
                      -e "ref:$env:GITHUB_REF_NAME" `
                      -e "run_url:$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
                      -e "run1:${{ steps.runtest.outputs.run1_passed }}p/${{ steps.runtest.outputs.run1_failed }}f/${{ steps.runtest.outputs.run1_skipped }}s" `
                      -e "run2:${{ steps.runtest.outputs.run2_passed }}p/${{ steps.runtest.outputs.run2_failed }}f/${{ steps.runtest.outputs.run2_skipped }}s" `
                      --release $release `
                      @logArgs

            - name: Summarize both runs
              if: always()
              shell: pwsh
              run: |
                  $d = "${{ steps.runtest.outputs.run1_passed }}/${{ steps.runtest.outputs.run1_failed }}/${{ steps.runtest.outputs.run1_skipped }}"
                  $a = "${{ steps.runtest.outputs.run2_passed }}/${{ steps.runtest.outputs.run2_failed }}/${{ steps.runtest.outputs.run2_skipped }}"
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "| run | passed | failed | skipped |"
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "| --- | --- | --- | --- |"
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "| default config | ${{ steps.runtest.outputs.run1_passed }} | ${{ steps.runtest.outputs.run1_failed }} | ${{ steps.runtest.outputs.run1_skipped }} |"
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "| all modules | ${{ steps.runtest.outputs.run2_passed }} | ${{ steps.runtest.outputs.run2_failed }} | ${{ steps.runtest.outputs.run2_skipped }} |"
                  Write-Host "default config (passed/failed/skipped): $d"
                  Write-Host "all modules    (passed/failed/skipped): $a"

            - name: Fail on test failures
              if: always() && steps.runtest.outputs.failed == 'true'
              shell: pwsh
              run: |
                  Write-Host "::error::the test suite reported failing cases; see the logs artifact or Sentry."
                  Write-Host "::error::default config -> ${{ steps.runtest.outputs.run1_passed }} passed, ${{ steps.runtest.outputs.run1_failed }} failed, ${{ steps.runtest.outputs.run1_skipped }} skipped"
                  Write-Host "::error::all modules    -> ${{ steps.runtest.outputs.run2_passed }} passed, ${{ steps.runtest.outputs.run2_failed }} failed, ${{ steps.runtest.outputs.run2_skipped }} skipped"
                  exit 1

            - name: Fail when server never started
              if: always() && steps.runtest.outputs.state == 'not-ready'
              shell: pwsh
              run: |
                  Write-Host "::error::server never reached 'Server started'."
                  exit 1

            - name: Fail when tests never finished
              if: always() && steps.runtest.outputs.ran == 'false'
              shell: pwsh
              run: |
                  Write-Host "::error::the test suite never reported a result in one of the two runs; the simulated player likely could not be created."
                  exit 1

            - name: Fail on unexpected error
              if: always() && steps.runtest.outputs.state == 'error'
              shell: pwsh
              run: |
                  Write-Host "::error::runtime test script crashed; see the logs artifact."
                  exit 1

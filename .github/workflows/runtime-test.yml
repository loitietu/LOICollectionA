name: Runtime Test

on:
    workflow_dispatch:
        inputs:
            levilamina_version:
                description: "LeviLamina version to install, e.g. 26.51.6. Leave empty to read it from tooth.json."
                required: false
                default: ""
    schedule:
        - cron: "0 18 * * 0"
    push:
        tags:
            - "v*"

concurrency:
    group: runtime-test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    runtime-test:
        runs-on: windows-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Resolve LeviLamina version
              id: llver
              shell: pwsh
              run: |
                  $ver = "${{ inputs.levilamina_version }}"
                  if ([string]::IsNullOrWhiteSpace($ver)) {
                      $m = Select-String -Path xmake.lua -Pattern 'levilamina\s+([0-9.]+)'
                      if (-not $m) { throw "cannot find levilamina version in xmake.lua" }
                      $ver = $m.Matches[0].Groups[1].Value
                  }
                  "version=$ver" >> $env:GITHUB_OUTPUT
                  Write-Host "LeviLamina version -> $ver"

            - name: Cache xmake
              uses: actions/cache@v4
              with:
                  path: ~/AppData/Local/.xmake
                  key: xmake-debug-server-${{ hashFiles('xmake.lua') }}
                  restore-keys: xmake-

            - name: Setup xmake
              uses: xmake-io/github-action-setup-xmake@v1

            - name: Setup LLVM
              uses: ZhongRuoyu/setup-llvm@v0
              with:
                  llvm-version: 22

            - name: Build plugin (debug, server)
              shell: pwsh
              run: |
                  xmake repo -u
                  xmake f -a x64 -m debug -p windows -y --target_type=server
                  xmake -v -y

            - name: Install lip
              shell: pwsh
              run: |
                  $release = Invoke-RestMethod -Uri "https://api.github.com/repos/futrime/lip/releases/latest"
                  $asset = $release.assets |
                      Where-Object { $_.name -like "lip-*-win-x64.zip" } |
                      Select-Object -First 1
                  if (-not $asset) { throw "no lip win-x64 zip in $($release.tag_name)" }
                  Write-Host "lip $($release.tag_name) -> $($asset.name)"
                  Invoke-WebRequest -Uri $asset.browser_download_url -OutFile lip.zip
                  Expand-Archive -Path lip.zip -DestinationPath lip -Force
                  $exe = (Resolve-Path ./lip/lip.exe).Path
                  "LIP=$exe" >> $env:GITHUB_ENV
                  & $exe --version

            - name: Install LeviLamina and BDS
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path server | Out-Null
                  Push-Location server
                  try {
                      & $env:LIP install "github.com/LiteLDev/LeviLamina@${{ steps.llver.outputs.version }}"
                      if ($LASTEXITCODE -ne 0) { throw "lip install failed with $LASTEXITCODE" }
                  } finally {
                      Pop-Location
                  }
                  Get-ChildItem server | Select-Object Name

            - name: Deploy plugin
              shell: pwsh
              run: |
                  $src = "build/bin-server/LOICollectionA"
                  if (-not (Test-Path $src)) { throw "build output missing: $src" }
                  New-Item -ItemType Directory -Force -Path "server/plugins" | Out-Null
                  Copy-Item -Path $src -Destination "server/plugins/" -Recurse -Force
                  Get-ChildItem "server/plugins/LOICollectionA" | Select-Object Name

            - name: Enable every plugin in the config
              shell: pwsh
              run: |
                  $dir = "server/plugins/LOICollectionA/config"
                  $cfg = "$dir/config.json"
                  New-Item -ItemType Directory -Force -Path $dir | Out-Null

                  $config = [ordered]@{
                      version         = 0
                      ConsoleLanguage = "system"
                      ServerConfig    = [ordered]@{
                          Plugins      = [ordered]@{
                              Blacklist     = [ordered]@{ ModuleEnabled = $true; BroadcastMessage = $true }
                              Mute          = $true
                              Cdk           = $true
                              Menu          = [ordered]@{ ModuleEnabled = $true; MenuItemId = "minecraft:clock"; EntranceKey = "main"; GuiPath = "menu.lcui" }
                              Tpa           = [ordered]@{ ModuleEnabled = $true; TargetScoreboard = "money"; BlacklistUpload = 10; RequestRequired = 100; RequestTimeout = 60; RequestUpload = 5 }
                              Shop          = [ordered]@{ ModuleEnabled = $true; GuiPath = "shop.lcui" }
                              Monitor       = [ordered]@{
                                  ModuleEnabled = $true
                                  BelowName     = [ordered]@{ ModuleEnabled = $true; RefreshInterval = 20; RefreshDisplayInterval = 100; Pages = @(, @("{player}")) }
                                  ServerToast   = [ordered]@{ ModuleEnabled = $true; Messager = [ordered]@{ join = $true; leave = $true } }
                                  ChangeScore   = [ordered]@{ ModuleEnabled = $true; ScoreboardLists = @() }
                                  DisableCommand = [ordered]@{ ModuleEnabled = $true; CommandLists = @() }
                                  DynamicMotd   = [ordered]@{ ModuleEnabled = $true; RefreshInterval = 200; Pages = @("'Players: ' + {server_player_online} + '/' + {server_player_max}") }
                                  Sidebar       = [ordered]@{ ModuleEnabled = $true; RefreshInterval = 20; Titles = @("'Title'"); Pages = @(, @("'Content'")) }
                              }
                              Pvp           = [ordered]@{ ModuleEnabled = $true; ExtraListener = [ordered]@{ onActorHurt = $true; onSplashPotion = $true; onProjectileHit = $true } }
                              Wallet        = [ordered]@{
                                  ModuleEnabled = $true
                                  TargetScoreboard = "money"
                                  ExchangeRate = 0.1
                                  RedEnvelopeTimeout = 60
                                  WalletHistoryEnabled = $true
                                  WalletHistoryRetentionDays = 90
                                  TransferMinAmount = 1
                                  TransferDailyLimit = 0
                                  TransferConfirmThreshold = 1000
                                  TransferCooldownSeconds = 0
                                  WealthTopSize = 50
                                  WealthRefreshMinutes = 10
                                  WalletBankEnabled = $true
                                  WalletBankMinDeposit = 10
                                  WalletBankDailyRate = 0.0005
                                  WalletInterestTaxRate = 0.1
                                  WalletInterestFromPool = $true
                                  RedEnvelopeTargetedEnabled = $true
                                  RedEnvelopeMaxCount = 100
                              }
                              Chat          = [ordered]@{ ModuleEnabled = $true; FormatText = "'<' + {player} + '> ' + `${0}"; BlacklistUpload = 10 }
                              Notice        = $true
                              Market        = [ordered]@{
                                  ModuleEnabled = $true
                                  TargetScoreboard = "money"
                                  MaximumUpload = 20
                                  BlacklistUpload = 10
                                  TradeRequestTimeout = 60
                                  TradeTimeout = 90
                                  ProhibitedItems = @()
                                  StoreEnabled = $true
                                  StoreReviewEnabled = $true
                                  StoreMaximumItems = 20
                                  StoreCreationCost = 0
                                  StoreSalesWeight = 0.5
                                  StoreVolumeWeight = 0.3
                                  StoreRatingWeight = 0.35
                                  StoreBadReviewPenalty = 3.0
                                  StoreColdStartWeight = 0.5
                                  StoreRatingSmoothing = 15.0
                                  StoreColdStartDays = 7
                                  StoreTransactionWindowDays = 30
                                  StoreRatingWindowDays = 180
                                  StoreRiskWindowDays = 30
                                  StoreRankRefreshMinutes = 60
                                  StoreQuoteEnabled = $true
                                  StoreQuoteRefreshMinutes = 30
                                  StoreTransactionTaxRate = 0.0
                                  StorePriceCeilingRatio = 0.0
                                  StoreWantedEnabled = $true
                                  StoreWantedMaxPerPlayer = 5
                                  StoreWantedExpireDays = 7
                                  StorePartialBuyEnabled = $true
                                  StoreAuctionEnabled = $true
                                  StoreAuctionMinDurationMinutes = 30
                                  StoreAuctionMaxDurationHours = 72
                                  StoreAuctionMinBidIncrement = 1.05
                                  StoreAuctionAntiSnipeSeconds = 0
                                  StoreRepeatTradeLimit = 3
                                  StorePriceOutlierRatio = 0.0
                              }
                              BehaviorEvent = [ordered]@{
                                  ModuleEnabled = $true
                                  OrganizeRetentionHours = 144
                                  CleanThresholdEvent = 10000
                                  CleanDatabaseInterval = 1
                                  RefreshIntervalInMinutes = 5
                                  SingleBacktrackingQuantity = 2000
                                  Events        = [ordered]@{
                                      onPlayerConnect         = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerDisconnect      = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerChat            = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerAddExperience   = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerAttack          = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerChangePerm      = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerDestroyBlock    = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerPlaceBlock      = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerDie             = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerPickUpItem      = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerRespawn         = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerUseItem         = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onPlayerContainerInteract = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                      onBlockExplode          = [ordered]@{ ModuleEnabled = $true; RecordDatabase = $true; OutputConsole = $true }
                                  }
                              }
                              Statistics    = [ordered]@{
                                  ModuleEnabled = $true
                                  RefreshIntervalInMinutes = 5
                                  RankingPlayerCount = 100
                                  DatabaseInfo = [ordered]@{ OnlineTime = $true; Kill = $true; Death = $true; Place = $true; Destroy = $true; Respawn = $true; Join = $true }
                              }
                          }
                          ProtableTool = [ordered]@{
                              BasicHook = [ordered]@{ ModuleEnabled = $true; FakeSeed = "`$random" }
                              RedStone  = 0
                              OrderedUI = $false
                          }
                      }
                      ClientConfig    = [ordered]@{
                          Music         = [ordered]@{
                              ModuleEnabled = $true
                              SourceAppFilters = @("cloudmusic", "netease")
                              IgnorePaused = $true
                              HoldDuration = 8.0
                              CardMaxWidth = 420.0
                              CardMinWidth = 300.0
                              CardPadding = 12.0
                              TitleFontSize = 24.0
                              ArtistFontSize = 16.0
                              AlbumFontSize = 14.0
                              LineSpacing = 8.0
                              CoverSize = 64.0
                              SlideDistance = 48.0
                              VisualizerHeight = 22.0
                              VisualizerBarGap = 2.0
                              EnterDuration = 0.5
                              ExitDuration = 0.4
                          }
                          LoadingScreen = [ordered]@{
                              ModuleEnabled = $true
                              RouteKeywords = @("loading", "preloading")
                              Title = "LOADING"
                              Tips = @("Loading terrain...")
                              CubeSize = 19.0
                              BarWidth = 440.0
                          }
                      }
                      ScriptPermission = [ordered]@{ PermissionFilePath = "gui/permission.json" }
                      LanguageServer   = [ordered]@{ enabled = $false; port = 9257 }
                  }

                  $config | ConvertTo-Json -Depth 16 | Set-Content -Path $cfg -Encoding utf8
                  Write-Host "enabled plugin config -> $cfg"

            - name: Prepare server
              shell: pwsh
              run: |
                  $cfg = "server/server.properties"
                  if (-not (Test-Path $cfg)) { New-Item -ItemType File -Force -Path $cfg | Out-Null }

                  foreach ($pair in @{ "online-mode" = "false"; "server-port" = "19132"; "allow-list" = "false" }.GetEnumerator()) {
                      $key = $pair.Key
                      $value = $pair.Value
                      $text = Get-Content $cfg -Raw -ErrorAction SilentlyContinue
                      if ($null -eq $text) { $text = "" }
                      if ($text -match "(?m)^$([regex]::Escape($key))=") {
                          $text = $text -replace "(?m)^$([regex]::Escape($key))=.*$", "$key=$value"
                      } else {
                          $text = $text.TrimEnd("`r", "`n") + "`n$key=$value`n"
                      }
                      Set-Content -Path $cfg -Value $text -NoNewline -Encoding ascii
                  }

                  Remove-Item "server/allowlist.json" -Force -ErrorAction SilentlyContinue
                  Remove-Item "server/permissions.json" -Force -ErrorAction SilentlyContinue

                  foreach ($key in "online-mode=false", "server-port=19132", "allow-list=false") {
                      if (-not (Select-String -Path $cfg -Pattern "^$([regex]::Escape($key))$" -Quiet)) {
                          throw "server.properties was not prepared correctly: missing $key"
                      }
                  }
                  Get-Content $cfg | Write-Host

            - name: Run server and the test suite
              id: runtest
              continue-on-error: true
              run: |
                  "failed=false" >> $env:GITHUB_OUTPUT
                  "state=unknown" >> $env:GITHUB_OUTPUT

                  function Read-Shared {
                      param([string]$Path)
                      if (-not (Test-Path $Path)) { return "" }
                      try {
                          $fs = [System.IO.File]::Open($Path, 'Open', 'Read', 'ReadWrite')
                          try {
                              $sr = New-Object System.IO.StreamReader($fs)
                              return $sr.ReadToEnd()
                          } finally { $fs.Dispose() }
                      } catch { return "" }
                  }

                  function Read-ServerLog {
                      param([string]$Stdout)
                      $file = "server/logs/latest.log"
                      if (Test-Path $file) {
                          $text = Read-Shared $file
                          if ($text) { return $text }
                      }
                      return Read-Shared $Stdout
                  }

                  try {
                      $exe = "server/bedrock_server_mod.exe"
                      if (-not (Test-Path $exe)) { throw "bedrock_server_mod.exe not found after lip install" }

                      $stdin  = (New-Item -ItemType File -Force -Path server/_stdin.log).FullName
                      $stdout = (New-Item -ItemType File -Force -Path server/_stdout.log).FullName
                      $stderr = (New-Item -ItemType File -Force -Path server/_stderr.log).FullName

                      $proc = Start-Process -FilePath (Resolve-Path $exe).Path `
                          -WorkingDirectory (Resolve-Path server).Path `
                          -RedirectStandardInput  $stdin `
                          -RedirectStandardOutput $stdout `
                          -RedirectStandardError  $stderr `
                          -PassThru -NoNewWindow

                      Write-Host "server pid $($proc.Id)"

                      $ready = $false
                      foreach ($i in 1..180) {
                          Start-Sleep -Seconds 1
                          if ($proc.HasExited) { break }
                          if ((Read-ServerLog $stdout) -match "Server started") { $ready = $true; break }
                      }

                      if (-not $ready) {
                          if ($proc.HasExited) {
                              Write-Host "::error::server exited with code $($proc.ExitCode) before reaching 'Server started'"
                          } else {
                              Write-Host "::error::server did not reach 'Server started' within 180s"
                              $proc.Kill()
                          }
                          Write-Host "::group::server log"
                          Read-ServerLog $stdout | Write-Host
                          Write-Host "::endgroup::"
                          Write-Host "::group::server stderr"
                          Read-Shared $stderr | Write-Host
                          Write-Host "::endgroup::"
                          "state=not-ready" >> $env:GITHUB_OUTPUT
                          $proc.WaitForExit()
                          return
                      }

                      Write-Host "server is ready, the test suite starts automatically on ServerStartedEvent"

                      $finished = $false
                      foreach ($i in 1..900) {
                          Start-Sleep -Seconds 1
                          $log = Read-ServerLog $stdout
                          if ($log -match "(?m)^\[.*?\]\[TestMain\] done: ") { $finished = $true; break }
                          if ($proc.HasExited) { break }
                          if ($i % 30 -eq 0) { Write-Host "waiting for the test suite, ${i}s..." }
                      }

                      if ($finished) {
                          Write-Host "test suite completed after ${i}s, waiting for the server to stop itself"
                      } elseif ($proc.HasExited) {
                          Write-Host "server exited before the suite reported results"
                      } else {
                          Write-Host "::error::no test result within 900s"
                      }

                      foreach ($i in 1..120) {
                          if ($proc.HasExited) { break }
                          Start-Sleep -Seconds 1
                      }
                      if (-not $proc.HasExited) {
                          Write-Host "::warning::server did not stop on its own, stopping it through stdin"
                          Add-Content -Path $stdin -Value "stop" -Encoding ascii
                          foreach ($i in 1..60) {
                              Start-Sleep -Seconds 1
                              if ($proc.HasExited) { break }
                          }
                      }
                      if (-not $proc.HasExited) { $proc.Kill() }
                      $proc.WaitForExit()

                      $final = Read-ServerLog $stdout
                      Write-Host "::group::server log"
                      ($final -split "`r?`n" | Select-Object -Last 400) | Write-Host
                      Write-Host "::endgroup::"

                      $failed = $finished -and ($final -match "(?m)^\[.*?\]\[TestMain\] done: [^\r\n]*failed")
                      "failed=$($failed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
                      "ran=$($finished.ToString().ToLower())" >> $env:GITHUB_OUTPUT
                      "state=done" >> $env:GITHUB_OUTPUT
                  } catch {
                      Write-Host "::error::runtime test crashed: $_"
                      "state=error" >> $env:GITHUB_OUTPUT
                  }

            - name: Collect logs
              if: always()
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path artifacts | Out-Null
                  $sources = @()
                  $sources += Get-ChildItem -Path server -Filter "_*.log" -File -ErrorAction SilentlyContinue
                  $sources += Get-ChildItem -Path server/logs -Recurse -File -ErrorAction SilentlyContinue
                  foreach ($f in $sources) {
                      $rel = $f.FullName.Substring((Resolve-Path server).Path.Length).TrimStart('\', '/')
                      $dest = Join-Path artifacts ($rel -replace '[\\/]', '__')
                      Copy-Item $f.FullName $dest -Force
                  }
                  Get-ChildItem artifacts | Select-Object Name, Length

            - name: Upload logs artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: runtime-test-logs-${{ github.sha }}
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Report failures to Sentry
              if: always() && (steps.runtest.outputs.failed == 'true' || steps.runtest.outputs.state == 'not-ready' || steps.runtest.outputs.state == 'error')
              shell: pwsh
              env:
                  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:SENTRY_DSN)) {
                      Write-Host "::warning::SENTRY_DSN not configured, skipping Sentry report"
                      exit 0
                  }

                  npm install -g @sentry/cli --no-fund --no-audit

                  $release = "${{ github.sha }}"
                  $reason = if ("${{ steps.runtest.outputs.state }}" -eq "not-ready") {
                      "server never reached 'Server started'"
                  } elseif ("${{ steps.runtest.outputs.state }}" -eq "error") {
                      "runtime test script crashed"
                  } else {
                      "the test suite reported failures"
                  }

                  $logArgs = @()
                  if (Test-Path "artifacts/_stdout.log") {
                      $logArgs = @("--logfile", "artifacts/_stdout.log")
                  } else {
                      Write-Host "::warning::no stdout log to attach"
                  }

                  sentry-cli send-event `
                      -m "LOICollectionA runtime-test failed: %s" -a $reason `
                      -t ci:runtime-test `
                      -e "release:$release" `
                      -e "run:$env:GITHUB_RUN_ID" `
                      -e "ref:$env:GITHUB_REF_NAME" `
                      -e "run_url:$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
                      --release $release `
                      @logArgs

            - name: Fail on test failures
              if: always() && steps.runtest.outputs.failed == 'true'
              shell: pwsh
              run: |
                  Write-Host "::error::the test suite reported failing cases; see the logs artifact or Sentry."
                  exit 1

            - name: Fail when server never started
              if: always() && steps.runtest.outputs.state == 'not-ready'
              shell: pwsh
              run: |
                  Write-Host "::error::server never reached 'Server started'."
                  exit 1

            - name: Fail when tests never finished
              if: always() && steps.runtest.outputs.ran == 'false'
              shell: pwsh
              run: |
                  Write-Host "::error::the test suite never reported a result; the simulated player likely could not be created."
                  exit 1

            - name: Fail on unexpected error
              if: always() && steps.runtest.outputs.state == 'error'
              shell: pwsh
              run: |
                  Write-Host "::error::runtime test script crashed; see the logs artifact."
                  exit 1

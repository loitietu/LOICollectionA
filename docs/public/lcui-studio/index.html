<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111216">
    <meta name="description" content="LCUI Studio - LOICollectionA .lcui 表单可视化编辑器，手机与电脑均可使用">
    <title>LCUI Studio · .lcui 可视化编辑器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='6' fill='%2327a17a'/%3E%3Crect x='14' y='22' width='20' height='6' rx='3' fill='%23e8f4ef'/%3E%3Crect x='14' y='34' width='36' height='6' rx='3' fill='%23e8f4ef' opacity='.8'/%3E%3Crect x='14' y='46' width='28' height='6' rx='3' fill='%23ffd166'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="appbar">
        <div class="appbar-brand">
            <span class="appbar-logo" aria-hidden="true"></span>
            <div class="appbar-title">
                <strong>LCUI <span class="brand-suffix">Studio</span></strong>
                <small id="formKindBadge">CustomForm</small>
            </div>
        </div>
        <div class="appbar-actions">
            <button id="btnUndo" class="tool icon" title="撤销 (Ctrl+Z)" aria-label="撤销" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-1"/></svg>
            </button>
            <button id="btnRedo" class="tool icon" title="重做 (Ctrl+Y)" aria-label="重做" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h1"/></svg>
            </button>
            <span class="appbar-sep"></span>
            <button id="btnNew" class="tool wide">新建</button>
            <button id="btnImport" class="tool wide">导入</button>
            <button id="btnSave" class="tool wide primary">保存</button>
        </div>
    </header>

    <main id="workspace">
        <aside id="palettePanel" class="panel">
            <div class="panel-head">组件库</div>
            <div id="palette" class="palette"></div>
            <div class="panel-head outline-head">结构</div>
            <div id="outline" class="outline"></div>
        </aside>

        <section id="canvasPanel" class="panel">
            <div class="panel-head canvas-head">
                <span>画布预览</span>
                <span id="canvasTitle" class="canvas-title"></span>
            </div>
            <div id="canvasScroll">
                <div id="canvas">
                    <div id="formMock" class="form-mock"></div>
                </div>
            </div>
            <div id="issuesBar" class="issues-bar" hidden></div>
        </section>

        <aside id="inspectorPanel" class="panel">
            <div class="panel-head" id="inspectorHead">表单设置</div>
            <div id="inspector" class="inspector"></div>
        </aside>

        <section id="codePanel" class="panel">
            <div class="panel-head code-head">
                <span>.lcui 源码</span>
                <div class="code-actions">
                    <button id="btnCopy" class="tool wide">复制</button>
                    <button id="btnDownload" class="tool wide">下载</button>
                    <button id="btnToggleCode" class="tool icon" title="折叠源码" aria-label="折叠源码">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
                    </button>
                </div>
            </div>
            <pre id="codeView" class="code-view"><code></code></pre>
        </section>

        <section id="logicPanel" class="panel logic-panel" hidden>
            <div class="panel-head logic-head">
                <div class="logic-title">
                    <strong id="logicTitle">回调逻辑</strong>
                    <small id="logicSubtitle"></small>
                </div>
                <button id="logicClose" class="tool" title="关闭" aria-label="关闭">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <div class="logic-body">
                <aside id="blockPalette" class="block-palette"></aside>
                <div class="block-main">
                    <div id="logicBar" class="logic-bar" hidden></div>
                    <div id="blockWorkspace" class="block-workspace"></div>
                </div>
            </div>
        </section>
    </main>

    <nav id="tabbar">
        <button class="tab active" data-tab="canvasPanel">
            <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg></span>画布
        </button>
        <button class="tab" data-tab="palettePanel">
            <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></span>组件
        </button>
        <button class="tab" data-tab="inspectorPanel">
            <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6M14 7h6M4 17h10M18 17h2"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg></span>属性
        </button>
        <button class="tab" data-tab="logicTab">
            <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v2.5a2.5 2.5 0 0 0 5 0H21v6h-2.5a2.5 2.5 0 0 0 0 5H21v3H9v-2.5a2.5 2.5 0 0 0-5 0H3v-6h2.5a2.5 2.5 0 0 0 0-5H3V4h6z"/></svg></span>逻辑
        </button>
        <button class="tab" data-tab="codePanel">
            <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg></span>代码
        </button>
    </nav>

    <dialog id="importDialog">
        <form method="dialog" class="dialog-form">
            <h3>导入 .lcui 脚本</h3>
            <p class="dialog-hint">仅支持由本编辑器生成的脚本结构（单一声明式表单 + 辅助变量）。</p>
            <input type="file" id="importFile" accept=".lcui,text/plain">
            <textarea id="importText" rows="12" spellcheck="false" placeholder="将 .lcui 文件内容粘贴到此处，或选择文件…"></textarea>
            <div id="importErrors" class="import-errors" hidden></div>
            <div class="dialog-actions">
                <button value="cancel" class="tool wide">取消</button>
                <button id="importConfirm" value="ok" class="tool wide primary">导入</button>
            </div>
        </form>
    </dialog>

    <dialog id="newDialog">
        <form method="dialog" class="dialog-form">
            <h3>新建表单</h3>
            <div id="newKindList" class="kind-list"></div>
            <label class="field-row"><span>表单标识</span><input id="newFormId" type="text" placeholder="example.main" autocomplete="off"></label>
            <label class="field-row"><span>表单标题</span><input id="newFormTitle" type="text" placeholder="我的表单" autocomplete="off"></label>
            <label class="check-row"><input id="newFormSample" type="checkbox" checked><span>填入示例组件</span></label>
            <div class="dialog-actions">
                <button value="cancel" class="tool wide">取消</button>
                <button id="newConfirm" value="ok" class="tool wide primary">创建</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>

    <script src="js/schema.js"></script>
    <script src="js/model.js"></script>
    <script src="js/codegen.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/blockview.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
